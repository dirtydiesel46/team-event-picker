name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Rust version
        run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo +1.90.0 test --locked
      - run: cargo +1.90.0 test --locked --test local_mongodb -- --ignored
        env:
          TEST_MONGODB_URL: mongodb://127.0.0.1:27017
